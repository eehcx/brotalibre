[package]
name = "brotalibre"
version = "0.2.0"
edition = "2024"
description = "Scaffold production-ready Angular projects with clean architecture and optional UI integrations"
license = "GPL-3.0"
repository = "https://github.com/eehcx/brotalibre"
readme = "README.md"
keywords = ["angular", "cli", "scaffold", "clean-architecture"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "brota"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
indicatif = "0.17"
minijinja = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
