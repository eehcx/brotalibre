name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to repair in the Homebrew tap
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build_artifacts:
    name: Build artifacts (${{ matrix.target }})
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install Debian packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dpkg-dev

      - name: Install Linux package builders
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked --version 3.7.0
          cargo install cargo-generate-rpm --locked --version 0.21.0

      - name: Package artifact (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.release_please.outputs.tag_name }}"
          VERSION="${TAG##*-v}"
          ASSET="brotalibre-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "${ASSET}" -C "target/${{ matrix.target }}/release" brota -C "${GITHUB_WORKSPACE}" templates
          if command -v sha256sum > /dev/null; then
            sha256sum "${ASSET}" > "${ASSET}.sha256"
          else
            shasum -a 256 "${ASSET}" > "${ASSET}.sha256"
          fi

      - name: Package Linux system packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.release_please.outputs.tag_name }}"
          VERSION="${TAG##*-v}"
          DEB_ASSET="brotalibre_${VERSION}-1_amd64.deb"
          RPM_ASSET="brotalibre-${VERSION}-1.x86_64.rpm"
          cargo deb --no-build --target "${{ matrix.target }}" --output "${DEB_ASSET}"
          cargo generate-rpm --target "${{ matrix.target }}" -o "${RPM_ASSET}"
          sha256sum "${DEB_ASSET}" > "${DEB_ASSET}.sha256"
          sha256sum "${RPM_ASSET}" > "${RPM_ASSET}.sha256"

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ needs.release_please.outputs.tag_name }}"
          $version = $tag -replace '^.*-v', ''
          $asset = "brotalibre-v$version-${{ matrix.target }}.zip"
          $archiveRoot = Join-Path $env:RUNNER_TEMP "brotalibre-release"
          New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null
          Copy-Item -Path target/${{ matrix.target }}/release/brota.exe -Destination (Join-Path $archiveRoot "brota.exe")
          Copy-Item -Path templates -Destination (Join-Path $archiveRoot "templates") -Recurse
          Compress-Archive -Path (Join-Path $archiveRoot "*") -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Out-File -FilePath "$asset.sha256" -Encoding ascii

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
            *.sha256

  upload_release_assets:
    name: Upload release assets
    needs: [release_please, build_artifacts]
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepend alpha disclaimer to release body
        id: release_body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG##*-v}"
          EXISTING="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // empty')"
          {
            printf '> ⚠️ **Alpha software — not production-ready.**\n'
            printf '> brotalibre %s is alpha-quality: features may change, break, or be incomplete. Do not use in production.\n' "${VERSION}"
            printf '\n---\n\n'
            printf '%s\n' "${EXISTING}"
          } > /tmp/release-body.md
          {
            printf 'body<<RELEASE_BODY_EOF\n'
            cat /tmp/release-body.md
            printf 'RELEASE_BODY_EOF\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Publish release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_please.outputs.tag_name }}
          body: ${{ steps.release_body.outputs.body }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.sha256

  update_homebrew_tap:
    name: Update Homebrew tap
    needs: [release_please, upload_release_assets]
    if: ${{ always() && ((needs.release_please.outputs.release_created == 'true' && needs.upload_release_assets.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PLEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_RELEASE_TAG}"
          if [[ -z "${TAG}" ]]; then
            TAG="${RELEASE_PLEASE_TAG}"
          fi
          if [[ ! "${TAG}" =~ ^ngseed-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' '::error::Provide a release tag in the form ngseed-v<major>.<minor>.<patch>.'
            exit 1
          fi
          printf 'tag=%s\n' "${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download release artifacts
        if: needs.release_please.outputs.release_created == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Download existing release checksums
        if: needs.release_please.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'brotalibre-v*-apple-darwin.tar.gz.sha256' \
            --dir dist

      - name: Render formula
        id: formula
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG##*-v}"
          ARM_ASSET="brotalibre-v${VERSION}-aarch64-apple-darwin.tar.gz"
          INTEL_ASSET="brotalibre-v${VERSION}-x86_64-apple-darwin.tar.gz"
          read -r ARM_SHA _ < "dist/${ARM_ASSET}.sha256"
          read -r INTEL_SHA _ < "dist/${INTEL_ASSET}.sha256"
          FORMULA_PATH="${RUNNER_TEMP}/brotalibre.rb"
          bash scripts/render-homebrew-formula.sh \
            "${VERSION}" "${TAG}" "${ARM_SHA}" "${INTEL_SHA}" "${FORMULA_PATH}"
          printf 'formula_path=%s\n' "${FORMULA_PATH}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Publish formula to tap
        env:
          FORMULA_PATH: ${{ steps.formula.outputs.formula_path }}
          RELEASE_VERSION: ${{ steps.formula.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            printf '%s\n' '::error::Set HOMEBREW_TAP_TOKEN before publishing a release.'
            exit 1
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "${HOMEBREW_TAP_TOKEN}" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" clone \
            --depth 1 \
            https://github.com/eehcx/homebrew-tap.git tap
          git -C tap checkout -B main
          mkdir -p tap/Formula
          cp "${FORMULA_PATH}" tap/Formula/brotalibre.rb
          if [[ -z "$(git -C tap status --porcelain -- Formula/brotalibre.rb)" ]]; then
            exit 0
          fi
          git -C tap add Formula/brotalibre.rb
          GIT_AUTHOR_NAME='github-actions[bot]' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_NAME='github-actions[bot]' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          git -C tap commit -m "brew: update brotalibre ${RELEASE_VERSION}"
          git -C tap -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" push --set-upstream origin main

  publish_crate:
    name: Publish crate to crates.io
    needs: [release_please, upload_release_assets]
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          TAG="${{ needs.release_please.outputs.tag_name }}"
          TAG_VERSION="${TAG##*-v}"
          if [[ "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch: Cargo.toml=${CARGO_VERSION} tag=${TAG}"
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked
